# Run: poetry run pre-commit install   (activates the git hook)
# Manual full sweep: poetry run pre-commit run --all-files
exclude: '^(web/|dist/|build/|public/|telegram-bot/|\.venv/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  # Revs pinned to match pyproject constraints (ruff <0.14, black <26) so the
  # hook and `poetry run` agree. Bump together with pyproject, not via autoupdate.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 25.1.0
    hooks:
      - id: black

  - repo: local
    hooks:
      - id: pyright
        name: pyright (whole project)
        entry: npx -y pyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        args: ["-p", "pyrightconfig.json"]
