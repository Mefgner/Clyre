# Run: poetry run pre-commit install   (activates the git hook)
# Manual full sweep: poetry run pre-commit run --all-files
exclude: '^(web/|dist/|build/|public/|telegram-bot/|\.venv/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  # Keep hook versions aligned with the Poetry lockfile. Bump together with
  # pyproject/poetry.lock, not via autoupdate.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.3
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 25.12.0
    hooks:
      - id: black

  - repo: local
    hooks:
      - id: pyright
        name: pyright (whole project)
        entry: npx -y pyright@1.1.413
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        args: ["-p", "pyrightconfig.json"]
      - id: pytest
        name: pytest (unit tests)
        entry: poetry run pytest
        language: system
        pass_filenames: false
        always_run: true
