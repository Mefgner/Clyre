# Run: poetry run pre-commit install   (activates the git hook)
# Manual full sweep (backend + frontend + tests): poetry run pre-commit run --all-files
# The frontend hooks below need Node/npm with `npm install` run once in the repo root.
exclude: '^(dist/|build/|public/|telegram-bot/|\.venv/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  # Keep hook versions aligned with the Poetry lockfile. Bump together with
  # pyproject/poetry.lock, not via autoupdate.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.3
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 25.12.0
    hooks:
      - id: black

  - repo: local
    hooks:
      - id: pyright
        name: pyright (whole project)
        entry: npx -y pyright@1.1.413
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        args: ["-p", "pyrightconfig.json"]
      - id: pytest
        name: pytest (unit tests)
        entry: poetry run pytest -m "not e2e"
        language: system
        pass_filenames: false
        always_run: true

      # Frontend hooks (source lives in web/, tooling in the repo root).
      # eslint runs with --fix: on the first run it rewrites files on disk and the
      # commit fails — just `git add` the fixes and commit again.
      - id: eslint
        name: eslint (frontend)
        entry: npx eslint --fix
        language: system
        files: ^web/.*\.(ts|vue|js)$|^vite\.config\.mts$
      - id: vue-tsc
        name: vue-tsc type-check (whole frontend)
        entry: npm run type-check
        language: system
        pass_filenames: false
        files: ^web/.*\.(ts|vue)$|^vite\.config\.mts$
