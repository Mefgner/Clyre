# Per-VRAM inference profiles, tuned for Qwen3.5-9B (the model floor).
# 4GB/6GB are below the floor and unsupported.
8gb:
  context: 16384
  batch_size: 2048
  u_batch_size: 1024
12gb:
  context: 32768
  batch_size: 3072
  u_batch_size: 1024
16gb:
  context: 131072
  batch_size: 8192
  u_batch_size: 2048
24gb:
  context: 131072
  batch_size: 8192
  u_batch_size: 2048
