# ggml-cuda.dll / cudart dlls all land together under binaries/<folder>.
- platform: win32
  necessary: true
  # llama.cpp | sentence-transformers
  type: llama.cpp
  filename: "llama-b10809-bin-win-cuda-12.4-x64.zip"
  folder: "llama-b10809-bin-win-cuda-12.4-x64"
  exe_name: "llama-server.exe"
  url: "https://github.com/ggml-org/llama.cpp/releases/download/b10809/llama-b10809-bin-win-cuda-12.4-x64.zip"
  sha256: "sha256:c77bfcd9ed8d91e8721a2d6a290b907fddd4fa5412a47b21c6fa1709116b85f9"
  dest_subdir: "binaries/"
  # WORKDIR / binaries / sha256 / folder / llama-server.exe (+ ggml-cuda.dll, ...)
- platform: win32
  necessary: false
  type: llama.cpp
  filename: "cudart-llama-bin-win-cuda-12.4-x64.zip"
  folder: "llama-b10809-bin-win-cuda-12.4-x64"
